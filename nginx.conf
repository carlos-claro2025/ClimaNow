server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CEMADEN does not send CORS headers, so the browser can only reach it
  # through a same-origin path. Mirrors the Vite dev proxy in vite.config.js.
  # Static hosts without nginx fall back to the cemaden-proxy Edge worker
  # (../cemaden-proxy); VITE_CEMADEN_BASE overrides the whole chain.
  location /api/cemaden/ {
    proxy_pass https://painelalertas.cemaden.gov.br/;
    proxy_ssl_server_name on;
    proxy_set_header Host painelalertas.cemaden.gov.br;
    proxy_set_header Origin https://painelalertas.cemaden.gov.br;
    proxy_set_header Referer https://painelalertas.cemaden.gov.br/;
    proxy_set_header Accept application/json;
    proxy_set_header User-Agent $http_user_agent;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: /chuva and any other client route must serve index.html,
  # otherwise a direct hit or reload returns 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
